[project]
name = "rshb-yield-forecast"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fsspec>=2026.9.0",
    "geopandas>=1.2.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "lxml>=6.1.3",
    "matplotlib>=3.11.2",
    "omfiles>=1.2.0",
    "openpyxl>=3.1.5",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "rarfile>=4.5",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "s3fs>=2026.9.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "tabulate>=0.10.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
report = [
    "docx2pdf>=0.1.8",
    "python-docx>=1.2.0",
]
